name: Update Avito feed

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-avito-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate feed
        env:
          SOURCE_FEED_URL: ${{ secrets.SOURCE_FEED_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_FEED_URL"
          curl --fail --silent --show-error --location "$SOURCE_FEED_URL" --output avito.xml.next
          grep -q '<Ads formatVersion="3" target="Avito.ru">' avito.xml.next
          grep -q '<Ad>' avito.xml.next
          grep -q '</Ads>' avito.xml.next
          mv avito.xml.next avito.xml

      - name: Publish changes
        run: |
          set -euo pipefail
          git config user.name "Avito Feed Bot"
          git config user.email "actions@users.noreply.github.com"
          git add avito.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Avito feed"
          git push
